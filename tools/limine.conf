timeout: 5
default_entry: 0
remember_last_entry: yes

/Fennix
	protocol: limine
	comment: Boot Fennix using limine protocol

	kernel_path: boot():/fennix.elf
	kernel_cmdline: --init=/bin/init

	module_path: boot():/rootfs.tar.gz
	module_cmdline: rootfs

/Advanced Options
	//Fennix with Linux Subsystem
		protocol: limine
		comment: Boot Fennix with Linux Subsystem

		kernel_path: boot():/fennix.elf
		kernel_cmdline: --init=/bin/init --linux=true

	//Fennix (Recovery)
		protocol: limine
		comment: Boot Fennix in recovery mode

		kernel_path: boot():/fennix.elf
		kernel_cmdline:

		module_path: boot():/rootfs.tar.gz
		module_cmdline: rootfs
