name: Build OS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  buildcompiler:
    name: Build Cross-Compiler & Toolchain
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Cache cross Folder
      id: cache-cross
      uses: actions/cache@v6
      with:
        path: tools/cross
        key: ${{ runner.os }}-cross-${{ hashFiles('tools/Makefile') }}

    - name: Prepare Environment for Dev Container
      run: |
        sudo mkdir -p /tmp/.X11-unix
        sudo mkdir -p /run/user/1000/pulse
        sudo touch /run/user/1000/pulse/native
        sudo touch /run/user/1000/xauth_ci
      env:
        XAUTHORITY: /run/user/1000/xauth_ci
        XDG_RUNTIME_DIR: /run/user/1000
        DISPLAY: :0
        WAYLAND_DISPLAY: wayland-0

    - name: Run make ci-setup in dev container
      if: steps.cache-cross.outputs.cache-hit != 'true'
      uses: devcontainers/ci@v0.3
      with:
        push: never
        runCmd: |
          /usr/bin/make ci-setup

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [buildcompiler]
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check for cache
      id: check-cache
      run: |
        if [ -z "${{ runner.os }}-cross-${{ hashFiles('tools/Makefile') }}" ]; then
          echo "No cache found, cancelling job."
          exit 1
        fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 0

    - name: Install Packages
      run: |
        sudo apt update
        sudo apt --no-install-recommends -y install rustc xorriso mtools genisoimage ovmf nasm doxygen make gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 mingw-w64 build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo
        make --quiet -C tools do_limine
        make --quiet prepare

    - name: Cache cross
      id: cache-cross
      uses: actions/cache@v6
      with:
        path: tools/cross
        key: ${{ runner.os }}-cross-${{ hashFiles('tools/Makefile') }}

    - name: Build OS
      run: |
        make build_userspace
        make build_drivers
        make build_kernel
        make build_userspace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  compile:
    name: Build ${{ matrix.arch }} (${{ matrix.type }})
    runs-on: ubuntu-latest
    needs: [buildcompiler]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm, aarch64]
        type: [debug, release]

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache cross Folder 💾
      id: cache-cross
      uses: actions/cache@v6
      with:
        path: tools/cross
        key: ${{ runner.os }}-cross-${{ hashFiles('tools/Makefile') }}

    - name: Prepare Environment for Dev Container
      run: |
        sudo mkdir -p /tmp/.X11-unix
        sudo mkdir -p /run/user/1000/pulse
        sudo touch /run/user/1000/pulse/native
        sudo touch /run/user/1000/xauth_ci
      env:
        XAUTHORITY: /run/user/1000/xauth_ci
        XDG_RUNTIME_DIR: /run/user/1000
        DISPLAY: :0
        WAYLAND_DISPLAY: wayland-0

    - name: Build 🏗️
      uses: devcontainers/ci@v0.3
      with:
        push: never
        runCmd: /usr/bin/make __ci-${{ matrix.arch }}-${{ matrix.type }}
  
    - name: Build Prepare Archive 📦
      if: always()
      uses: devcontainers/ci@v0.3
      with:
        push: never
        runCmd: /usr/bin/make __ci-prepare-archive

    - name: Upload Artifact 📁
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.arch }}-${{ matrix.type }}
        path: artifacts/

  nightly:
    if: always()
    name: Upload Nightly Build to GitHub Releases
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download All Builds 💾
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly 🚀
      run: gh release upload nightly artifacts/* -R ${{github.repository}} --clobber

    env:
      GH_TOKEN: ${{ github.token }}
