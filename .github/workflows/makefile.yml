name: Build OS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  changes:
    name: Detect Toolchain Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tools: ${{ steps.filter.outputs.tools }}
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Detect toolchain changes 🔍
      id: filter
      uses: dorny/paths-filter@v4
      with:
        filters: |
          tools:
            - 'tools/**'

  build_toolchain:
    name: Build and Publish Toolchain Image
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Set up Docker Buildx 🏗️
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry 🔑
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish toolchain image 🚀
      uses: docker/build-push-action@v7
      with:
        context: .
        file: tools/Dockerfile
        push: true
        tags: ghcr.io/enderice2/fennix-toolchain:latest
        cache-from: type=gha,scope=toolchain
        cache-to: type=gha,mode=max,scope=toolchain

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [changes, build_toolchain]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.build_toolchain.result == 'success' ||
       needs.build_toolchain.result == 'skipped')
    container:
      image: ghcr.io/enderice2/fennix-toolchain:latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 0

    - name: Install Build Dependencies ⚙️
      run: |
        python3 -m pip install git-cliff --break-system-packages
        if [ -e tools/cross ] && [ ! -L tools/cross ]; then echo "tools/cross already exists and is not a symlink"; exit 1; fi
        make --quiet -C tools do_limine
        make --quiet prepare

    - name: Build OS
      run: |
        make build_userspace
        make build_drivers
        make build_kernel
        make build_userspace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  compile:
    name: Build ${{ matrix.arch }} (${{ matrix.type }})
    runs-on: ubuntu-latest
    needs: [changes, build_toolchain]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.build_toolchain.result == 'success' ||
       needs.build_toolchain.result == 'skipped')
    container:
      image: ghcr.io/enderice2/fennix-toolchain:latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm, aarch64]
        type: [debug, release]

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Build Dependencies ⚙️
      run: |
        python3 -m pip install git-cliff --break-system-packages
        if [ -e tools/cross ] && [ ! -L tools/cross ]; then echo "tools/cross already exists and is not a symlink"; exit 1; fi
        make --quiet -C tools do_limine
        make --quiet prepare

    - name: Build 🏗️
      run: make __ci-${{ matrix.arch }}-${{ matrix.type }}
  
    - name: Build Prepare Archive 📦
      if: always()
      run: make __ci-prepare-archive

    - name: Upload Artifact 📁
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.arch }}-${{ matrix.type }}
        path: artifacts/

  nightly:
    if: always()
    name: Upload Nightly Build to GitHub Releases
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download All Builds 💾
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly 🚀
      run: gh release upload nightly artifacts/* -R ${{github.repository}} --clobber

    env:
      GH_TOKEN: ${{ github.token }}
